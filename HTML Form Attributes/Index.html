<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contoh HTML Form Attributes</title>
  </head>
  <body>
    <h1>Contoh HTML Form Attributes</h1>

    <form action="/submit-form" method="post" target="_self" autocomplete="on">
      <label for="nama">Nama lengkap:</label>
      <input
        type="text"
        id="nama"
        name="nama"
        placeholder="Masukkan nama"
        required
      />
      <br /><br />

      <label for="email">Email:</label>
      <input
        type="email"
        id="email"
        name="email"
        placeholder="nama@contoh.com"
        required
      />
      <br /><br />

      <label for="usia">Usia:</label>
      <input type="number" id="usia" name="usia" min="1" max="120" />
      <br /><br />

      <label for="pesan">Pesan:</label>
      <textarea id="pesan" name="pesan" rows="4" cols="30"></textarea>
      <br /><br />

      <input type="submit" value="Kirim" />
      <input type="reset" value="Reset" />
    </form>
  </body>
</html>
